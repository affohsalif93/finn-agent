[project]
name = "finn"
version = "0.1.0"
description = "Finn: e-mail agent that checks loan covenants against a business plan"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio>=1.35",
    "typer>=0.28",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "openai>=3",
    "jinja2>=3.1.6",
]

[project.scripts]
finn = "finn.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff also formats code blocks in Markdown; the docs hold illustrative pseudo-code, keep it as is.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "DTZ",  # naive datetimes (deadlines, covenant dates)
    "PT",   # pytest style
]
# German labels and numbers use typographic characters on purpose (plan titles, unit labels,
# formulas such as "0,5 × 22.800").
allowed-confusables = ["–", "−", "×"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# `strict` is a global-only option in mypy, so it applies to everything in `files`, i.e. the
# `finn` package. Tests are not type-checked (ruff still lints them).
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests (need Docker / a running Temporal) are deselected by default;
# run them with `uv run pytest -m integration` (the last -m on the command line wins).
# Live mail tests need the compose profile `testmail` (GreenMail): `uv run pytest -m mailserver`.
addopts = "-ra --strict-markers -m 'not integration and not mailserver'"
markers = [
    "integration: needs Docker / a running Temporal server (deselected by default)",
    "mailserver: live mail tests against GreenMail, compose profile testmail (deselected)",
]
