[project]
name = "finn"
version = "0.1.0"
description = "Finn: e-mail agent that checks loan covenants against a business plan"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio>=1.35",
    "typer>=0.28",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
]

[project.scripts]
finn = "finn.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn"]
