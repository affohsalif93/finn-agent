# Finn runtime: Temporal dev server + worker + poller (ARCHITECTURE.md §13).
#   docker compose up -d                                core stack
#   Temporal UI: http://localhost:8233 (localhost only)

name: finn

x-finn: &finn
  build: .
  image: finn:dev
  env_file:
    - path: .env          # secrets live here, never in the image
      required: false     # the stack also starts without one
  environment:
    TEMPORAL_ADDRESS: temporal:7233
  depends_on:
    temporal:
      condition: service_healthy
  restart: unless-stopped
  init: true              # forwards SIGTERM to finn, reaps zombies
  logging: &logging       # rotate container logs (long-running on a small VM)
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  temporal:
    image: temporalio/temporal:1.9.1   # Temporal CLI 1.9.1 = Server 1.32.0, UI 2.54.1
    # The image runs as user "temporal" (uid 1000). A named volume mounted at a path that exists
    # in the image inherits its owner, so the SQLite file goes into the (temporal-owned) home dir.
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
    volumes:
      - temporal-data:/home/temporal
    ports:
      - "127.0.0.1:7233:7233"   # gRPC frontend, for `finn` runs on the host
      - "127.0.0.1:8233:8233"   # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  finn-worker:
    <<: *finn
    command: ["worker"]
    volumes:
      - ./runs:/app/runs
      - ./data/contract_profiles:/app/data/contract_profiles:ro
      - ./material:/app/material:ro

  finn-poller:
    <<: *finn
    command: ["poller"]
    volumes:
      - ./runs:/app/runs

  # ── Local test mail server (optional): `--profile testmail` (ARCHITECTURE §13.1) ──────
  # GreenMail (SMTP + IMAP, in memory) + Roundcube (webmail) + Finn's own worker / poller for
  # it, so test mail never touches the real mailbox or the real worker: own env file (only test
  # passwords), own task queue `finn-testmail`, own runs folder, own image tag. Start without
  # touching the core services:
  #   docker compose --profile testmail up -d --build --no-deps \
  #     greenmail roundcube finn-worker-testmail finn-poller-testmail
  greenmail:
    profiles: [testmail]
    image: greenmail/standalone:2.1.15
    # Auth enabled (no greenmail.auth.disabled): only these passwords work; login = full address.
    # Any other recipient gets a mailbox on first delivery (login and password = its address).
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users.login=email
        -Dgreenmail.users=finn:finn-test@finn.test,finn-pytest:finn-test@finn.test,cfo:cfo-test@stadtwerke.test,blocked:blocked-test@stadtwerke.test,eve:eve-test@unbekannt.test
    ports:
      - "127.0.0.1:3025:3025"   # SMTP (plain, AUTH PLAIN/LOGIN; no STARTTLS)
      - "127.0.0.1:3143:3143"   # IMAP (plain; MOVE, UIDPLUS, no SPECIAL-USE)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3143 && exec 4<>/dev/tcp/127.0.0.1/3025"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  roundcube:
    profiles: [testmail]
    image: roundcube/roundcubemail:1.7.5-apache
    depends_on:
      greenmail: {condition: service_healthy}
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: greenmail     # no "ssl://" prefix: plain IMAP
      ROUNDCUBEMAIL_DEFAULT_PORT: "3143"
      ROUNDCUBEMAIL_SMTP_SERVER: greenmail
      ROUNDCUBEMAIL_SMTP_PORT: "3025"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
    volumes:
      - ./docker/roundcube/testmail.inc.php:/var/roundcube/config/testmail.inc.php:ro
    ports:
      - "127.0.0.1:8080:80"     # http://localhost:8080, login e.g. cfo@stadtwerke.test / cfo-test
    restart: unless-stopped

  finn-worker-testmail:
    <<: *finn
    profiles: [testmail]
    image: finn:testmail        # own tag: rebuilding it never touches the running finn:dev stack
    env_file:
      - path: .env.testmail.example   # committed, test passwords only: works out of the box
      - path: .env.testmail           # optional local overrides (git-ignored), e.g. a real key
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: finn-testmail
      # LLM mode, set by `finn demo send-cases [--real-llm]` / `pytest -m mailserver
      # --mail-driver compose [--real-llm]`: stand-in by default; the key only for --real-llm.
      FINN_LLM_FAKE: ${TESTMAIL_LLM_FAKE:-true}
      OPENAI_API_KEY: ${TESTMAIL_OPENAI_API_KEY:-}
    depends_on:
      temporal: {condition: service_healthy}
      greenmail: {condition: service_healthy}
    command: ["worker"]
    volumes:
      - ./runs-testmail:/app/runs
      - ./data/contract_profiles:/app/data/contract_profiles:ro
      - ./material:/app/material:ro

  finn-poller-testmail:
    <<: *finn
    profiles: [testmail]
    image: finn:testmail
    env_file:
      - path: .env.testmail.example
      - path: .env.testmail
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: finn-testmail
      # LLM mode, set by `finn demo send-cases [--real-llm]` / `pytest -m mailserver
      # --mail-driver compose [--real-llm]`: stand-in by default; the key only for --real-llm.
      FINN_LLM_FAKE: ${TESTMAIL_LLM_FAKE:-true}
      OPENAI_API_KEY: ${TESTMAIL_OPENAI_API_KEY:-}
    depends_on:
      temporal: {condition: service_healthy}
      greenmail: {condition: service_healthy}
    command: ["poller"]
    volumes:
      - ./runs-testmail:/app/runs

volumes:
  temporal-data:
