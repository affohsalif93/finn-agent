name: CI

on:
  push:
  pull_request:

# A new push to the same branch / PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes no floating major tag
        with:
          version: "0.13.7"                 # same uv as the Dockerfile
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked, incl. dev group)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy

      # The Temporal test environment downloads the Temporal CLI on first use (~130 MB).
      - name: Tests
        run: uv run pytest
